name: CI

# The team's laptops sit behind a corporate network filter that blocks package
# registries, so install/build/test verification happens here instead.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.project }} — install, test, build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: [advocate-dc, policy-diff, jargon-sidebar]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
